<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>弹簧图纸 AI 审查助手</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css?v=20261023-surface-sources-v2">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-topbar">
        <div class="topbar-spacer" aria-hidden="true"></div>
        <div class="topbar-brand">
          <h1>弹簧图纸 AI 审查助手</h1>
        </div>
        <div class="topbar-actions">
          <div id="identityProfile" class="identity-profile" hidden aria-live="polite">
            <span id="identityProfileName" class="identity-profile-name"></span>
            <span id="identityProfileOrg" class="identity-profile-org"></span>
            <small id="identityProfileSource" class="identity-profile-source"></small>
          </div>
          <button id="demoButton" type="button">加载样例</button>
          <button id="exportButton" type="button" disabled>导出</button>
        </div>
      </header>

      <div class="app-workspace">
        <aside id="recentReviews" class="history-sidebar" aria-label="历史订单">
          <div class="history-sidebar-top">
            <button id="newReviewButton" class="history-new-review-button" type="button" title="清空当前审图界面，新建一次审图">
              <span aria-hidden="true">＋</span>
              新建审图
            </button>
            <button id="toggleHistorySidebar" class="history-sidebar-toggle" type="button" aria-label="收起历史订单" title="收起历史订单" aria-expanded="true" aria-controls="newReviewButton historySidebarContent">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
            </button>
          </div>
          <div id="historySidebarContent">
          <div class="history-sidebar-head">
            <h2>历史订单</h2>
            <button id="historyUnreadCount" class="history-unread-count" type="button" title="定位第一条尚未查看的新识别结果" hidden></button>
            <div class="history-header-actions">
              <button id="enterHistoryManagement" type="button">批量管理</button>
              <button id="refreshRecentReviewsButton" class="history-refresh-button" type="button" title="刷新历史订单" aria-label="刷新历史订单">刷新</button>
            </div>
          </div>
          <div id="historyManagement" class="history-management" aria-label="历史订单批量管理" hidden>
            <div id="historySelectionControls" class="history-selection-controls" hidden>
              <span id="historySelectedCount">已选0项</span>
              <button id="historySelectAll" type="button">全选当前列表</button>
              <button id="historyClearSelection" type="button">取消全选</button>
              <button id="historyDeleteSelected" class="history-delete-selected" type="button" disabled>删除所选（0）</button>
              <button id="exitHistoryManagement" type="button">退出管理</button>
            </div>
            <p id="historyDeletionProgress" role="status" hidden></p>
            <p id="historyDeletionNotice" role="status" hidden></p>
            <details id="historyDeletionResults" class="history-deletion-results" hidden>
              <summary id="historyDeletionSummary"></summary>
              <ul id="historyDeletionResultList"></ul>
            </details>
            <div class="history-deletion-actions">
              <button id="historyRetryFailed" type="button" hidden>重试失败项</button>
              <button id="historyCheckUnknown" type="button" hidden>刷新核对</button>
              <button id="historyClearDeletionResults" type="button" hidden>清除结果</button>
            </div>
          </div>
          <div id="recentReviewList" class="history-order-list"></div>
          </div>
        </aside>

        <div class="chat-stage">
        <section id="conversation" class="conversation" aria-label="审图对话">
          <article class="message assistant">
            <div class="avatar">AI</div>
            <div class="message-body">
              <div class="message-meta">助手 · 图纸审查</div>
              <p>上传 PDF 或图片后，我会提取弹簧图纸里的结构化尺寸数据，并在这里等待你确认或修改。</p>
            </div>
          </article>
        </section>

        <div class="composer" aria-label="图纸上传">
          <div id="dropZone" class="drop-zone">
            <input id="drawingInput" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp" multiple hidden>
            <input id="drawingFolderInput" type="file" webkitdirectory multiple hidden>
            <input id="reviewJsonInput" type="file" accept="application/json,.json" hidden>
            <div class="upload-copy">
              <strong id="selectedFileName">图纸上传</strong>
              <span id="uploadHelpText">多选或拖入文件、文件夹 · 每批最多50份</span>
            </div>
            <section id="uploadQueue" class="upload-queue" aria-label="上传状态" hidden>
              <p id="uploadScanStatus" class="upload-scan-status" role="status" hidden></p>
              <p id="uploadQueueNotice" class="upload-queue-notice" role="status" hidden></p>
              <div id="uploadQueueList">
                <details id="uploadPendingSection" class="upload-section" hidden>
                  <summary><span id="uploadPendingSummary">待上传</span><span class="upload-section-action">查看清单</span></summary>
                  <ul id="uploadPendingList" class="upload-queue-list" aria-label="待上传文件"></ul>
                </details>
                <details id="uploadProgressSection" class="upload-section" hidden>
                  <summary><span id="uploadProgressSummary">识别进度</span><span class="upload-section-action">查看进度</span></summary>
                  <ul id="uploadProgressList" class="upload-queue-list" aria-label="正在识别的文件"></ul>
                </details>
                <details id="uploadProblemsSection" class="upload-section upload-problems" hidden>
                  <summary><span id="uploadProblemsSummary">待处理</span><span class="upload-section-action">查看问题</span></summary>
                  <ul id="uploadProblemsList" class="upload-queue-list" aria-label="上传待处理项"></ul>
                </details>
              </div>
              <div id="uploadCompletion" class="upload-completion" hidden>
                <span id="uploadCompletionText" role="status"></span>
                <button id="clearUploadCompletion" type="button">清除提示</button>
              </div>
              <div id="uploadQueueControls" class="upload-queue-controls" hidden>
                <button id="pauseUploadButton" type="button" hidden>停止后续上传</button>
                <button id="clearUploadsButton" type="button">清空待上传</button>
              </div>
              <p id="uploadUnsentHint" class="upload-queue-hint" hidden>未上传文件仅保留在本页，刷新后需重新选择。</p>
            </section>
            <div class="composer-toolbar">
              <div class="composer-tools">
                <button id="chooseFileButton" class="tool-button" type="button">
                  <span class="tool-icon" aria-hidden="true">＋</span>
                  选择文件
                </button>
                <button id="chooseFolderButton" class="tool-button" type="button">选择文件夹</button>
                <details id="advancedOptions" class="advanced-options">
                  <summary>
                    <span class="tool-icon sliders-icon" aria-hidden="true">☷</span>
                    高级选项
                  </summary>
                  <div class="advanced-popover advanced-popover-qwen-only">
                    <div class="advanced-head">
                      <div>
                        <strong>高级选项</strong>
                        <span>配置视觉识别</span>
                      </div>
                    </div>
                    <div class="advanced-grid advanced-grid-qwen-only">
                      <label class="api-field">
                        后端地址
                        <input id="apiBaseInput" type="url" value="http://127.0.0.1:8770">
                      </label>
                      <label class="check-control qwen-option">
                        <input id="useQwenInput" type="checkbox" checked>
                        调用 Qwen3.7 视觉识别
                      </label>
                      <label class="check-control">
                        <input id="useOcrInput" type="checkbox">
                        调用 OCR
                      </label>
                      <label class="check-control">
                        <input id="useLlmStandardizationInput" type="checkbox">
                        标准化时调用 RAG/LLM
                      </label>
                      <label class="api-field provider-field">
                        OCR 引擎
                        <select id="ocrProviderInput">
                          <option value="baidu_paddleocr_vl">百度 PaddleOCR-VL 文档解析（消耗页数）</option>
                          <option value="auto" selected>自动：百度优先 / RapidOCR 兜底</option>
                          <option value="baidu_ocr">百度高精度含位置</option>
                          <option value="rapidocr">RapidOCR 本地识别</option>
                        </select>
                      </label>
                      <label class="check-control">
                        <input id="useVlmInput" type="checkbox" disabled>
                        VLM 低置信度复核（待接入）
                      </label>
                      <label class="api-field provider-field">
                        VLM 引擎
                        <select id="visionProviderInput" disabled>
                          <option value="none" selected>暂未接入</option>
                          <option value="local">本地/私有模型</option>
                          <option value="baidu">国内云视觉模型</option>
                          <option value="openai">OpenAI 视觉模型</option>
                          <option value="azure">Azure 视觉模型</option>
                        </select>
                      </label>
                      <label class="check-control legacy-werk24-option" hidden>
                        <input id="useWerk24Input" type="checkbox">
                        调用 Werk24
                      </label>
                      <label class="check-control legacy-werk24-option" hidden>
                        <input id="confirmWerk24Input" type="checkbox">
                        确认上传到 Werk24
                      </label>
                      <label class="check-control legacy-werk24-option" hidden>
                        <input id="useCachedWerk24Input" type="checkbox">
                        使用缓存 Werk24
                      </label>
                      <label class="check-control">
                        <input id="useSampleOcrInput" type="checkbox">
                        使用样例 OCR
                      </label>
                      <button id="loadReviewJsonButton" type="button">导入审查 JSON</button>
                    </div>
                  </div>
                </details>
              </div>
              <button id="submitButton" class="submit-button" type="button" aria-label="开始识别" disabled>开始识别</button>
            </div>
          </div>
        </div>
      </div>
      </div>
    </main>

    <script src="./company-surface-mapping.js?v=20261023-surface-sources-v2"></script>
    <script src="./drawing-annotations.js?v=20261020-leader-edge"></script>
    <script src="./technical-requirement-translation.js?v=20261023-surface-sources-v2"></script>
    <script src="./technical-requirement-recovery.js?v=20261013-recognition-aliases"></script>
    <script src="./compression-design-checks.js?v=20261015-support-coils"></script>
    <script src="./formula-candidates.js?v=20261015-formula-candidates"></script>
    <script src="./technical-requirement-equivalence.js?v=20261016-eight-class-dedup"></script>
    <script src="./diameter-linkage.js?v=20261022-diameter-linkage"></script>
    <script src="./accuracy-inference.js?v=20261022-diameter-basis"></script>
    <script src="./generation-settings.js?v=20261021-generation-settings"></script>
    <script src="./solidworks-export.js?v=20261023-surface-sources-v2"></script>
    <script src="./surface-roughness-reference.js?v=20261020-roughness-v3"></script>
    <script src="./drawing-upload-queue.js?v=20261020-repeat-uploads"></script>
    <script src="./history-recognition-unread.js?v=20261019-history-unread"></script>
    <script src="./history-bulk-deletion.js?v=20261019-bulk-delete"></script>
    <script src="./app.js?v=20261023-surface-sources-v2"></script>
  </body>
</html>
