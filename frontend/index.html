<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>弹簧图纸 AI 审查助手</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css?v=20260623-no-werk24-geometry">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-topbar">
        <div class="topbar-spacer" aria-hidden="true"></div>
        <div class="topbar-brand">
          <h1>弹簧图纸 AI 审查助手</h1>
          <p id="backendStatus">正在检查后端...</p>
        </div>
        <div class="topbar-actions">
          <button id="demoButton" type="button">加载样例</button>
          <button id="checkApiButton" type="button">检查后端</button>
          <button id="exportButton" type="button" disabled>导出</button>
        </div>
      </header>

      <div class="chat-stage">
        <section id="conversation" class="conversation" aria-label="审图对话">
          <article class="message assistant">
            <div class="avatar">AI</div>
            <div class="message-body">
              <div class="message-meta">助手 · 图纸审查</div>
              <p>上传 PDF 或图片后，我会提取弹簧图纸里的结构化尺寸数据，并在这里等待你确认或修改。</p>
            </div>
          </article>
        </section>

        <div class="composer" aria-label="图纸上传">
          <div id="dropZone" class="drop-zone">
            <input id="drawingInput" type="file" accept=".pdf,image/*" hidden>
            <input id="reviewJsonInput" type="file" accept="application/json,.json" hidden>
            <div class="upload-copy">
              <strong id="selectedFileName">上传 PDF 或图片开始审查</strong>
              <span>支持拖拽上传 · PDF、PNG、JPG、TIFF、BMP、WEBP</span>
            </div>
            <div class="composer-toolbar">
              <div class="composer-tools">
                <button id="chooseFileButton" class="tool-button" type="button">
                  <span class="tool-icon" aria-hidden="true">＋</span>
                  选择文件
                </button>
                <details id="advancedOptions" class="advanced-options">
                  <summary>
                    <span class="tool-icon sliders-icon" aria-hidden="true">☷</span>
                    高级选项
                  </summary>
                  <div class="advanced-popover">
                    <div class="advanced-head">
                      <div>
                        <strong>高级选项</strong>
                        <span>配置识别来源与后端连接</span>
                      </div>
                    </div>
                    <div class="advanced-grid">
                      <label class="api-field">
                        后端地址
                        <input id="apiBaseInput" type="url" value="http://127.0.0.1:8770">
                      </label>
                      <label class="check-control">
                        <input id="useOcrInput" type="checkbox" checked>
                        调用 OCR
                      </label>
                      <label class="check-control">
                        <input id="useGeometryInput" type="checkbox" checked>
                        调用几何分析
                      </label>
                      <label class="api-field provider-field">
                        OCR 引擎
                        <select id="ocrProviderInput">
                          <option value="baidu_paddleocr_vl">百度 PaddleOCR-VL 文档解析（消耗页数）</option>
                          <option value="auto" selected>自动：百度优先 / RapidOCR 兜底</option>
                          <option value="baidu_ocr">百度高精度含位置</option>
                          <option value="rapidocr">RapidOCR 本地识别</option>
                        </select>
                      </label>
                      <label class="check-control">
                        <input id="useVlmInput" type="checkbox" disabled>
                        VLM 低置信度复核（待接入）
                      </label>
                      <label class="api-field provider-field">
                        VLM 引擎
                        <select id="visionProviderInput" disabled>
                          <option value="none" selected>暂未接入</option>
                          <option value="local">本地/私有模型</option>
                          <option value="baidu">国内云视觉模型</option>
                          <option value="openai">OpenAI 视觉模型</option>
                          <option value="azure">Azure 视觉模型</option>
                        </select>
                      </label>
                      <label class="check-control legacy-werk24-option" hidden>
                        <input id="useWerk24Input" type="checkbox">
                        调用 Werk24
                      </label>
                      <label class="check-control legacy-werk24-option" hidden>
                        <input id="confirmWerk24Input" type="checkbox">
                        确认上传到 Werk24
                      </label>
                      <label class="check-control legacy-werk24-option" hidden>
                        <input id="useCachedWerk24Input" type="checkbox">
                        使用缓存 Werk24
                      </label>
                      <label class="check-control">
                        <input id="useSampleOcrInput" type="checkbox">
                        使用样例 OCR
                      </label>
                      <button id="loadReviewJsonButton" type="button">导入审查 JSON</button>
                    </div>
                  </div>
                </details>
              </div>
              <button id="submitButton" class="submit-button" type="button" aria-label="开始审查" disabled>↑</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="./app.js?v=20260623-no-werk24-geometry"></script>
  </body>
</html>
